<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
        body {
            margin: 0;
            background-color: white;
        }

        #app-loading {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100vw;
            height: 100vh;

        @media (prefers-color-scheme: dark) {
            body {
                background-color: #141414;

</head>

<div id="root">
    <div id="app-loading">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 150" width="80" height="40">
            <path fill="none" stroke="#4E47BB" stroke-width="15" stroke-linecap="round" stroke-dasharray="300 385"
                  stroke-dashoffset="0"
                  d="M275 75c0 31-27 50-50 50-58 0-92-100-150-100-28 0-50 22-50 50s23 50 50 50c58 0 92-100 150-100 24 0 50 19 50 50Z">
                <animate attributeName="stroke-dashoffset" calcMode="spline" dur="1.4" values="685;-685"
                         keySplines="0 0 1 1" repeatCount="indefinite"></animate>
            </path>
        </svg>
    </div>
</div>
<script type="module" src="/common/main.tsx"></script>

</html>
