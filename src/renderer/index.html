<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
        body {
            margin: 0;
            background-color: white;
        }
        #app-loading {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100vw;
            height: 100vh;
        }
        @media (prefers-color-scheme: dark) {
            body {
                background-color: #141414;
            }
        }
    </style>
</head>
<body>
<div id="root">
    <div id="app-loading">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" height="40" width="40">
            <circle transform-origin="center" fill="none" stroke="#888" stroke-width="15" stroke-linecap="round"
                    stroke-dasharray="200 1000" stroke-dashoffset="0" cx="100" cy="100" r="70">
                <animateTransform type="rotate" attributeName="transform" calcMode="spline" dur="0.8" values="0;360"
                                  keyTimes="0;1" keySplines="0 0 1 1" repeatCount="indefinite"></animateTransform>
            </circle>
        </svg>
    </div>
</div>
<script type="module" src="/common/main.tsx"></script>
</body>
</html>
